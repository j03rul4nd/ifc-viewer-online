server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # web-ifc's multithreaded WASM needs SharedArrayBuffer, which the browser
    # only enables under cross-origin isolation. These two headers mirror the
    # Vite dev server config (vite.config.ts → server.headers).
    add_header Cross-Origin-Opener-Policy   "same-origin"   always;
    add_header Cross-Origin-Embedder-Policy "require-corp"  always;

    # nginx 1.27's bundled mime.types already maps .wasm → application/wasm.
    # (A `types {}` block here would REPLACE the inherited map, not extend it,
    # breaking text/html for index.html — so we rely on the default include.)

    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_types      text/plain text/css application/javascript application/json
                    image/svg+xml application/wasm;

    # Long-cache the fingerprinted build assets.
    location /assets/ {
        expires    1y;
        add_header Cache-Control "public, immutable";
        # add_header inside a location block drops inherited headers, so re-add.
        add_header Cross-Origin-Opener-Policy   "same-origin"  always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
    }

    # SPA fallback: serve index.html for client-side routed paths, but still let
    # real files (the generated /fix/ SEO pages, sitemap.xml, *.wasm) win first.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
