<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IFC Viewer Online — Open IFC files in your browser</title>
    <meta name="description" content="Free online IFC viewer. Open any .ifc file directly in your browser — no login, no upload, no plugin. Fast WebGL rendering via WebAssembly. Supports IFC2x3, IFC4, IFC4x3." />
    <meta name="keywords" content="IFC viewer online, open IFC file online, BIM viewer web, free IFC viewer, web-ifc, three.js IFC, IFC2x3, IFC4" />
    <meta property="og:title" content="IFC Viewer Online — Open IFC files in your browser" />
    <meta property="og:description" content="Open any IFC file in your browser. No login, no upload. Fast WebGL rendering." />
    <meta property="og:type" content="website" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%235E6AD2'/%3E%3Cpath d='M8 22 L16 8 L24 22 Z M12 22 L16 15 L20 22' stroke='white' stroke-width='1.5' fill='none'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  </head>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker
        .register('%BASE_URL%coi-serviceworker.js')
        .then(() => {
          if (!sessionStorage.getItem('coiReloaded')) {
            sessionStorage.setItem('coiReloaded', '1')
            location.reload()
          }
        })
    }
  </script>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
