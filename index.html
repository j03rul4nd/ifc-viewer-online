  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker
        .register('%BASE_URL%coi-serviceworker.js')
        .then(() => {
          if (!sessionStorage.getItem('coiReloaded')) {
            sessionStorage.setItem('coiReloaded', '1')
            location.reload()
          }
        })
    }
    // Stale-chunk resilience: after a new deploy, an already-open client may
    // request a lazy chunk hash that no longer exists (→ 404). Reload once to
    // pick up the fresh index.html + chunk graph instead of crashing.
    window.addEventListener('vite:preloadError', () => {
      if (!sessionStorage.getItem('chunkReloaded')) {
        sessionStorage.setItem('chunkReloaded', '1')
        location.reload()
      }
    })
  </script>
