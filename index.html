    <!-- AI / LLM discoverability: see /ifc-viewer-online/llms.txt -->

    <!-- JSON-LD: FAQPage — static, bot-readable without JS execution -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "Is my IFC file uploaded anywhere?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No. Files are parsed entirely in your browser via web-ifc, a WebAssembly build of the open-source IFC parser. Nothing leaves your machine. The app works completely offline once loaded."
          }
        },
        {
          "@type": "Question",
          "name": "Can I use it with confidential models under NDA?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. Because all processing happens in your browser and no data is ever transmitted to any server, you can safely use it with confidential project models under NDA. There is no service agreement to review with your client — no data changes hands."
          }
        },
        {
          "@type": "Question",
          "name": "Can I share the validation results with my team or client?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. After running validation, use the Share Report button to generate a URL that encodes the full results. Your client opens it in any browser without installing anything or creating an account. The IFC file itself is never included in the link."
          }
        },
        {
          "@type": "Question",
          "name": "Does it work on Mac?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes, fully. IFC Viewer Online works on any modern browser — Chrome, Edge, Firefox, and Safari on both Mac and Windows. No plugin, no installation, no operating system restriction."
          }
        },
        {
          "@type": "Question",
          "name": "What IFC versions are supported?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "IFC2x3, IFC4, IFC4x1, and IFC4x3. The viewer uses the open-source web-ifc parser — the same engine used by most modern BIM tools and @thatopen/components. Outdated schemas are automatically flagged by the validator."
          }
        },
        {
          "@type": "Question",
          "name": "How does the validation work?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "The validator runs 18 built-in rules in a background Web Worker so the UI stays responsive. Rules cover GUID duplicates, spatial hierarchy, orphan elements, naming conventions, missing type assignments, clash detection, and more. Results stream in as each rule completes."
          }
        },
        {
          "@type": "Question",
          "name": "Can I fix errors and re-export a corrected IFC?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. All edits (GUID fixes, renames, property value changes) are held as non-destructive diffs with full undo/redo. Clicking Export IFC applies all diffs to the original binary in a Web Worker and downloads the corrected file — no server involved."
          }
        },
        {
          "@type": "Question",
          "name": "Does it work offline?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes, once the page is loaded. The WebAssembly parser and WebGL renderer run entirely in the browser. Parsed geometry is cached in OPFS so repeat loads are instant even without a network connection."
          }
        }
      ]
    }
    </script>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker
        .register('%BASE_URL%coi-serviceworker.js')
        .then(() => {
          if (!sessionStorage.getItem('coiReloaded')) {
            sessionStorage.setItem('coiReloaded', '1')
            location.reload()
          }
        })
    }
  </script>
