name: Deploy to GitHub Pages

# This workflow deploys to GitHub Pages and runs ONLY on the `github-pages`
# branch. `main` is the Vercel deployment target (custom domain, root base) and
# must not trigger a Pages build. Push to `github-pages` to publish to
# https://j03rul4nd.github.io/ifc-viewer-online/ ; the env-driven base path
# defaults to the project subpath here (no BASE_PATH set).
on:
  push:
    branches: ["github-pages"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_POSTHOG_KEY: ${{ secrets.VITE_POSTHOG_KEY }}
          VITE_POSTHOG_HOST: ${{ secrets.VITE_POSTHOG_HOST }}
          VITE_SUBSCRIBE_URL: ${{ secrets.VITE_SUBSCRIBE_URL }}
          VITE_REPORT_URL: ${{ secrets.VITE_REPORT_URL }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./dist"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5