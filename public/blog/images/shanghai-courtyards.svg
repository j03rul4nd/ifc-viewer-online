<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc"><title id="title">Keeping the void is modelling too</title><desc id="desc">The outer boundary is not enough: courtyards, islands and paths change the usable surface.</desc><rect width="1200" height="600" rx="18" fill="#101d2b"/><g font-family="Arial, sans-serif"><text x="48" y="62" font-size="34" fill="#ffffff">Keeping the void is modelling too</text><text x="48" y="102" font-size="21" fill="#9fb6cb">The outer boundary is not enough: courtyards, islands and paths change the usable surface.</text><rect x="60" y="161" width="490" height="325" rx="8" fill="#244a40"/><rect x="650" y="161" width="490" height="325" rx="8" fill="#244a40"/><text x="87" y="208" font-size="23" fill="#ffb1a9">THE HOLES ARE LOST</text><text x="677" y="208" font-size="23" fill="#79dbd2">THE RELATIONSHIPS ARE KEPT</text><rect x="220" y="263" width="167" height="131" rx="8" fill="#46765c"/><rect x="810" y="263" width="167" height="131" rx="8" fill="#101d2b"/><text x="843" y="337" font-size="25" fill="#d9e6ef">Courtyard</text><rect x="82" y="420" width="445" height="21" rx="0" fill="#46765c"/><rect x="672" y="420" width="445" height="21" rx="0" fill="#d2b895"/><ellipse cx="447" cy="301" rx="55" ry="50" fill="#527e77"/><ellipse cx="1037" cy="301" rx="55" ry="50" fill="#527e77"/><ellipse cx="1037" cy="301" rx="20" ry="19" fill="#bdc5a0"/><circle cx="110" cy="430" r="15" fill="#83a565"/><circle cx="180" cy="430" r="15" fill="#83a565"/><circle cx="250" cy="430" r="15" fill="#83a565"/><circle cx="320" cy="430" r="15" fill="#83a565"/><circle cx="390" cy="430" r="15" fill="#83a565"/><circle cx="460" cy="430" r="15" fill="#83a565"/><text x="87" y="518" font-size="21" fill="#ffb1a9">Vegetation over the path</text><text x="677" y="518" font-size="21" fill="#79dbd2">Clear path · open courtyard · island</text><path d="M48 539L1152 539" stroke="#314657" stroke-width="1" fill="none"/><text x="48" y="574" font-size="17" fill="#8fa8bc">IFC VIEWER ONLINE  /  SHANGHAI</text><text x="733" y="574" font-size="17" fill="#8fa8bc">DIAGRAM · NOT TO SCALE · NOT A SURVEY</text></g></svg>