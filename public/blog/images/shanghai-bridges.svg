<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc"><title id="title">A bridge is understood through its connections</title><desc id="desc">The deck, the stair and the lift must share arrival points.</desc><rect width="1200" height="600" rx="18" fill="#101d2b"/><g font-family="Arial, sans-serif"><text x="48" y="62" font-size="34" fill="#ffffff">A bridge is understood through its connections</text><text x="48" y="102" font-size="21" fill="#9fb6cb">The deck, the stair and the lift must share arrival points.</text><rect x="60" y="454" width="1080" height="22" rx="0" fill="#607788"/><rect x="350" y="260" width="690" height="23" rx="2" fill="#79dbd2"/><path d="M388 283L388 454" stroke="#8199a8" stroke-width="12" fill="none"/><path d="M808 283L808 454" stroke="#8199a8" stroke-width="12" fill="none"/><path d="M110 454H150V423H190V392H230V361H270V330H310V299H350V260" stroke="#dbe6ea" stroke-width="8" fill="none"/><rect x="951" y="300" width="64" height="153" rx="8" fill="#39546b"/><rect x="955" y="205" width="56" height="240" rx="8" fill="#253c52"/><path d="M983 220L983 430" stroke="#edb896" stroke-width="4" fill="none"/><circle cx="350" cy="260" r="15" fill="#edb896"/><circle cx="984" cy="260" r="15" fill="#edb896"/><text x="71" y="230" font-size="23" fill="#d9e6ef">Stair</text><path d="M161 244L230 346" stroke="#a4bbcc" stroke-width="2" fill="none"/><text x="410" y="210" font-size="23" fill="#d9e6ef">Deck and landing</text><text x="905" y="170" font-size="23" fill="#d9e6ef">Lift</text><text x="455" y="367" font-size="24" fill="#79dbd2">Shared elevation at every joint</text><text x="455" y="402" font-size="25" fill="#edb896">layer ≠ height in metres</text><text x="73" y="512" font-size="21" fill="#d9e6ef">Ground and access</text><path d="M48 539L1152 539" stroke="#314657" stroke-width="1" fill="none"/><text x="48" y="574" font-size="17" fill="#8fa8bc">IFC VIEWER ONLINE  /  SHANGHAI</text><text x="733" y="574" font-size="17" fill="#8fa8bc">DIAGRAM · NOT TO SCALE · NOT A SURVEY</text></g></svg>