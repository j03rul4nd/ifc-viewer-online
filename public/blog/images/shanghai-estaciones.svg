<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc"><title id="title">La cubierta protege un espacio abierto</title><desc id="desc">Separar soportes, andén y vía permite revisar cotas y colisiones.</desc><rect width="1200" height="600" rx="18" fill="#101d2b"/><g font-family="Arial, sans-serif"><text x="48" y="62" font-size="34" fill="#ffffff">La cubierta protege un espacio abierto</text><text x="48" y="102" font-size="21" fill="#9fb6cb">Separar soportes, andén y vía permite revisar cotas y colisiones.</text><path d="M150 215Q600 90 1050 215L1050 234Q600 115 150 234Z" fill="#adc4d8"/><rect x="190" y="226" width="20" height="233" rx="0" fill="#6c879a"/><rect x="991" y="226" width="20" height="233" rx="0" fill="#6c879a"/><rect x="130" y="451" width="940" height="23" rx="0" fill="#415970"/><rect x="670" y="396" width="225" height="55" rx="0" fill="#b8c9d1"/><rect x="337" y="410" width="215" height="25" rx="0" fill="#738f99"/><rect x="365" y="389" width="18" height="33" rx="0" fill="#79dbd2"/><rect x="506" y="389" width="18" height="33" rx="0" fill="#79dbd2"/><text x="494" y="179" font-size="25" fill="#d9e6ef">Cubierta</text><text x="686" y="378" font-size="24" fill="#d9e6ef">Andén</text><text x="365" y="365" font-size="24" fill="#79dbd2">Carriles</text><path d="M522 406L651 406" stroke="#edb896" stroke-width="2" fill="none"/><path d="M642 398L642 435" stroke="#edb896" stroke-width="3" fill="none"/><text x="522" y="502" font-size="23" fill="#edb896">Comparar la cota del andén con la vía</text><text x="345" y="292" font-size="27" fill="#ffffff">Conservar el vacío inferior</text><path d="M48 539L1152 539" stroke="#314657" stroke-width="1" fill="none"/><text x="48" y="574" font-size="17" fill="#8fa8bc">IFC VIEWER ONLINE  /  SHANGHAI</text><text x="733" y="574" font-size="17" fill="#8fa8bc">ESQUEMA · SIN ESCALA · NO TOPOGRÁFICO</text></g></svg>