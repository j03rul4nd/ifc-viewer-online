<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Real-time LiDAR to IFC browser pipeline</title>
  <desc id="desc">A five-stage pipeline from LiDAR sensor through edge filtering and binary transport to a bounded browser buffer and an IFC digital twin.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1119"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#5e6ad2"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0L12 6L0 12Z" fill="#22d3ee"/>
    </marker>
  </defs>
  <rect width="1600" height="900" rx="40" fill="url(#bg)"/>
  <circle cx="1350" cy="80" r="340" fill="#5e6ad2" opacity=".08"/>
  <circle cx="220" cy="850" r="300" fill="#22d3ee" opacity=".06"/>

  <text x="110" y="125" fill="#f8fafc" font-family="Inter,Segoe UI,sans-serif" font-size="50" font-weight="700">Real-time LiDAR in the browser</text>
  <text x="110" y="178" fill="#94a3b8" font-family="Inter,Segoe UI,sans-serif" font-size="25">A bounded, timestamped path from physical sensor to an IFC digital twin</text>

  <g font-family="Inter,Segoe UI,sans-serif">
    <g transform="translate(85 310)">
      <rect width="245" height="250" rx="26" fill="#111c2c" stroke="#334155" stroke-width="2"/>
      <circle cx="122" cy="78" r="45" fill="#0b1220" stroke="#22d3ee" stroke-width="5"/>
      <path d="M82 83Q122 42 162 83M92 101Q122 72 152 101" fill="none" stroke="#67e8f9" stroke-width="5" stroke-linecap="round"/>
      <text x="122" y="170" text-anchor="middle" fill="#f8fafc" font-size="25" font-weight="700">LiDAR sensor</text>
      <text x="122" y="205" text-anchor="middle" fill="#94a3b8" font-size="18">XYZ · RGB · intensity</text>
    </g>

    <g transform="translate(385 310)">
      <rect width="245" height="250" rx="26" fill="#111c2c" stroke="#334155" stroke-width="2"/>
      <path d="M62 60h120v80H62zM82 82h80M82 104h55M82 126h38" fill="none" stroke="#34d399" stroke-width="7" stroke-linecap="round"/>
      <text x="122" y="170" text-anchor="middle" fill="#f8fafc" font-size="25" font-weight="700">Edge gateway</text>
      <text x="122" y="205" text-anchor="middle" fill="#94a3b8" font-size="18">ROI · voxel · frame ID</text>
    </g>

    <g transform="translate(685 310)">
      <rect width="245" height="250" rx="26" fill="#111c2c" stroke="#334155" stroke-width="2"/>
      <path d="M58 80h128M58 112h128M58 144h128" stroke="#f59e0b" stroke-width="9" stroke-linecap="round"/>
      <circle cx="84" cy="80" r="8" fill="#fcd34d"/><circle cx="150" cy="112" r="8" fill="#fcd34d"/><circle cx="112" cy="144" r="8" fill="#fcd34d"/>
      <text x="122" y="170" text-anchor="middle" fill="#f8fafc" font-size="25" font-weight="700">Binary transport</text>
      <text x="122" y="205" text-anchor="middle" fill="#94a3b8" font-size="18">sequence · time · CRC</text>
    </g>

    <g transform="translate(985 310)">
      <rect width="245" height="250" rx="26" fill="#111c2c" stroke="#334155" stroke-width="2"/>
      <rect x="53" y="62" width="140" height="94" rx="12" fill="#0b1220" stroke="#a78bfa" stroke-width="4"/>
      <path d="M76 133l27-37 25 22 25-39 18 54" fill="none" stroke="#c4b5fd" stroke-width="6" stroke-linejoin="round"/>
      <text x="122" y="190" text-anchor="middle" fill="#f8fafc" font-size="25" font-weight="700">2–3 frame buffer</text>
      <text x="122" y="222" text-anchor="middle" fill="#94a3b8" font-size="18">newest valid wins</text>
    </g>

    <g transform="translate(1285 310)">
      <rect width="245" height="250" rx="26" fill="#111c2c" stroke="url(#cyan)" stroke-width="3"/>
      <path d="M55 135V86l66-36 69 36v49l-69 38zM121 50v123M55 86l66 38 69-38" fill="none" stroke="#22d3ee" stroke-width="5" stroke-linejoin="round" filter="url(#glow)"/>
      <circle cx="84" cy="102" r="5" fill="#fbbf24"/><circle cx="106" cy="137" r="5" fill="#34d399"/><circle cx="148" cy="92" r="5" fill="#fbbf24"/><circle cx="165" cy="126" r="5" fill="#34d399"/>
      <text x="122" y="205" text-anchor="middle" fill="#f8fafc" font-size="25" font-weight="700">IFC + points</text>
      <text x="122" y="235" text-anchor="middle" fill="#94a3b8" font-size="18">GPU overlay</text>
    </g>
  </g>

  <g stroke="#22d3ee" stroke-width="5" marker-end="url(#arrow)" opacity=".9">
    <path d="M338 435h36"/><path d="M638 435h36"/><path d="M938 435h36"/><path d="M1238 435h36"/>
  </g>

  <g transform="translate(145 690)" font-family="Inter,Segoe UI,sans-serif">
    <rect width="1310" height="100" rx="22" fill="#0b1220" stroke="#223047"/>
    <text x="42" y="42" fill="#67e8f9" font-size="21" font-weight="700">Backpressure rule</text>
    <text x="42" y="73" fill="#cbd5e1" font-size="21">A live view discards stale frames instead of turning network delay into an ever-growing queue.</text>
  </g>
</svg>
