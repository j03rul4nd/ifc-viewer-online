<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc"><title id="title">Tres capas. Tres niveles de evidencia.</title><desc id="desc">Separar el edificio, su entorno y el detalle evita confundir apariencia con precisión.</desc><rect width="1200" height="600" rx="18" fill="#101d2b"/><g font-family="Arial, sans-serif"><text x="48" y="62" font-size="34" fill="#ffffff">Tres capas. Tres niveles de evidencia.</text><text x="48" y="102" font-size="21" fill="#9fb6cb">Separar el edificio, su entorno y el detalle evita confundir apariencia con precisión.</text><rect x="48" y="158" width="345" height="318" rx="8" fill="#1a3443"/><rect x="427" y="158" width="345" height="318" rx="8" fill="#223147"/><rect x="806" y="158" width="345" height="318" rx="8" fill="#323040"/><text x="76" y="207" font-size="27" fill="#79dbd2">01 / IFC</text><text x="455" y="207" font-size="27" fill="#a9c4ff">02 / CARTOGRAFÍA</text><text x="834" y="207" font-size="27" fill="#edb896">03 / DETALLE</text><rect x="100" y="245" width="52" height="89" rx="8" fill="#79dbd2"/><rect x="170" y="264" width="83" height="70" rx="8" fill="#4d9d9e"/><rect x="269" y="221" width="57" height="113" rx="8" fill="#9cddd6"/><path d="M468 270L727 333" stroke="#a9c4ff" stroke-width="14" fill="none"/><path d="M480 340L688 246" stroke="#65799b" stroke-width="11" fill="none"/><circle cx="875" cy="282" r="25" fill="#ae9877"/><path d="M875 302L875 340" stroke="#d8c6a5" stroke-width="6" fill="none"/><circle cx="945" cy="282" r="25" fill="#ae9877"/><path d="M945 302L945 340" stroke="#d8c6a5" stroke-width="6" fill="none"/><circle cx="1015" cy="282" r="25" fill="#ae9877"/><path d="M1015 302L1015 340" stroke="#d8c6a5" stroke-width="6" fill="none"/><text x="76" y="389" font-size="23" fill="#d9e6ef">Elementos y propiedades</text><text x="76" y="424" font-size="23" fill="#d9e6ef">del archivo del edificio</text><text x="455" y="389" font-size="23" fill="#d9e6ef">Huellas, rutas y etiquetas</text><text x="455" y="424" font-size="23" fill="#d9e6ef">disponibles para el lugar</text><text x="834" y="389" font-size="23" fill="#d9e6ef">Formas aproximadas</text><text x="834" y="424" font-size="23" fill="#d9e6ef">cuando faltan medidas</text><path d="M48 539L1152 539" stroke="#314657" stroke-width="1" fill="none"/><text x="48" y="574" font-size="17" fill="#8fa8bc">IFC VIEWER ONLINE  /  SHANGHAI</text><text x="733" y="574" font-size="17" fill="#8fa8bc">ESQUEMA · SIN ESCALA · NO TOPOGRÁFICO</text></g></svg>