<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>Shipment tracking</title>
<style>
:root{--a:#5E6AD2;--bg:#f5f6f8;--tx:#1a2130;--pn:#fff;--r:12px;--f:system-ui,-apple-system,"Segoe UI",sans-serif;--ln:color-mix(in srgb,var(--tx) 14%,transparent);--mt:color-mix(in srgb,var(--tx) 65%,transparent)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 var(--f)}
#app{max-width:640px;margin:auto;padding:16px;display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
header{display:flex;flex-direction:column;gap:2px;padding:4px 0}.brand{display:flex;align-items:center;color:inherit;text-decoration:none;font-size:18px}.brand img{height:36px;max-width:220px;object-fit:contain}.tag{margin:0;color:var(--mt);font-size:14px}
.card{background:var(--pn);border:1px solid var(--ln);border-radius:var(--r);padding:18px}.card>:first-child{margin-top:0}.card>:last-child{margin-bottom:0}
h1{font-size:24px;line-height:1.2;letter-spacing:-.01em;margin:0 0 8px}h2{font-size:15px;margin:0 0 10px}p{margin:0 0 10px}.meta{color:var(--mt);font-size:14px;margin-bottom:4px}.meta b{color:var(--tx)}.eta{margin-top:12px}
.sample{justify-self:start;padding:2px 10px;border-radius:99px;font-size:12px;color:#8a5a00;background:#f5a52426;border:1px solid #f5a52466;margin:0}
.steps{list-style:none;display:flex;gap:8px;padding:0;margin:16px 0 8px;font-size:12px;color:var(--mt)}.steps li{flex:1;min-width:0}.steps .on{color:var(--tx)}.steps .cur{font-weight:600;color:var(--a)}.steps .late{color:#b86e00}
.bar{height:6px;border-radius:3px;background:var(--ln);overflow:hidden}.bar i{display:block;height:100%;background:var(--a)}
.btn,.ghost,.copy{display:inline-block;min-height:44px;padding:11px 20px;border-radius:8px;font:600 15px var(--f);text-decoration:none;cursor:pointer;border:0;margin-top:14px}.btn{background:var(--a);color:#fff}.ghost,.copy{background:transparent;color:var(--tx);border:1px solid var(--ln);margin-top:0}
a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--a);outline-offset:2px}
.tl{list-style:none;margin:0;padding:0}.tl li{padding:8px 0 8px 14px;border-inline-start:2px solid var(--ln)}.tl b,.tl span{display:block}.tl span{font-size:13px;color:var(--mt)}
.stars{display:flex;gap:4px}.stars a{font-size:30px;line-height:44px;width:44px;text-align:center;text-decoration:none;color:var(--a)}
.promo{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.promo p{margin:0 0 4px}.promo code{font-size:18px;font-weight:700;letter-spacing:.04em}
.prods{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}.prod{display:flex;flex-direction:column;gap:2px;color:inherit;text-decoration:none;background:var(--pn);border:1px solid var(--ln);border-radius:var(--r);padding:10px}.prod img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:calc(var(--r)/2);margin-bottom:6px}.prod span{color:var(--mt);font-size:14px}
.find{display:flex;gap:8px}.find input{flex:1;min-width:0;height:44px;padding:0 12px;font:16px var(--f);color:var(--tx);background:transparent;border:1px solid var(--ln);border-radius:8px}.find .btn{margin:0}
footer{color:var(--mt);font-size:12px;text-align:center;padding:8px 0}footer p{margin:0 0 4px}footer a{color:inherit}
</style></head><body><main id="app"></main>
<script src="tracker.js"></script><script src="page.js"></script>
</body></html>
